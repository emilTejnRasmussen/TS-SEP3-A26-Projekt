syntax = "proto3";

package kin.events;

option java_multiple_files = true;
option java_package = "dk.kin.eventserver.grpc";

service EventService {
  rpc CreateEvent (CreateEventRequest) returns (EventResponse);
  rpc GetAllEvents (Empty) returns (EventListResponse);
}

message CreateEventRequest {
  string title = 1;
  string short_description = 2;
  string long_description = 3;
  string location = 4;
  int32 max_participants = 5;
  string date_time = 6;
  repeated int64 host_ids = 7;
}

message EventResponse {
  int64 id = 1;
  string title = 2;
  string short_description = 3;
  string long_description = 4;
  string location = 5;
  int32 max_participants = 6;
  string date_time = 7;
  repeated int64 host_ids = 8;
}

message EventOverviewResponse {
  int64 id = 1;
  string title = 2;
  string short_description = 3;
  string location = 4;
  string date_time = 5;
}

message EventListResponse {
  repeated EventOverviewResponse events = 1;
}

message Empty {}